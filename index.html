<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EIT Reconstruction Viewer · TFG</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:       #080c10;
    --panel:    #0e1318;
    --border:   #1c2530;
    --accent:   #00d4ff;
    --accent2:  #ff6b35;
    --muted:    #4a6070;
    --text:     #d0dce8;
    --text-dim: #6a8090;
    --mono:     'Space Mono', monospace;
    --sans:     'DM Sans', sans-serif;
    --radius:   6px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
  }

  .app {
    display: grid;
    grid-template-rows: 56px 1fr;
    grid-template-columns: 260px 1fr;
    height: 100vh;
    overflow: hidden;
  }

  header {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    position: relative;
    z-index: 100;
  }
  .logo-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
    animation: pulse 2.5s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 10px var(--accent); }
    50%       { opacity: .5; box-shadow: 0 0 4px var(--accent); }
  }
  header h1 {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .08em;
    color: var(--accent);
    text-transform: uppercase;
  }
  header .subtitle {
    font-size: 11px;
    color: var(--text-dim);
    font-style: italic;
    display: none;
  }
  @media (min-width: 600px) {
    header .subtitle { display: block; }
  }
  header .badge {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: .1em;
    text-transform: uppercase;
    text-align: right;
  }
  .burger {
    display: none;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: var(--radius);
    padding: 4px 8px;
    cursor: pointer;
    font-size: 16px;
    margin-left: 8px;
    flex-shrink: 0;
  }

  /* ── SIDEBAR ─────────────────────────────────────────── */
  aside {
    grid-row: 2;
    overflow-y: auto;
    border-right: 1px solid var(--border);
    background: var(--panel);
    padding: 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  aside::-webkit-scrollbar { width: 4px; }
  aside::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .filter-group { display: flex; flex-direction: column; gap: 5px; }
  .filter-label {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    padding-bottom: 2px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 2px;
  }
  .filter-btn {
    width: 100%;
    text-align: left;
    padding: 6px 8px;
    border: 1px solid transparent;
    border-radius: var(--radius);
    background: transparent;
    color: var(--text-dim);
    font-family: var(--sans);
    font-size: 13px;
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .filter-btn:hover  { background: #131c24; color: var(--text); border-color: var(--border); }
  .filter-btn.active { background: #0b1e2d; color: var(--accent); border-color: #00d4ff44; }

  /* Foto en sidebar (solo desktop) */
  .sidebar-foto { display: none; }
  @media (min-width: 701px) {
    .sidebar-foto {
      display: block;
      margin-top: 4px;
    }
    .sidebar-foto img {
      width: 100%;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      display: block;
    }
    .sidebar-foto-label {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }
  }

  /* ── MAIN ────────────────────────────────────────────── */
  main {
    grid-row: 2;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  main::-webkit-scrollbar { width: 4px; }
  main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* ── CONTROL BAR (freq + componente) ─────────────────── */
  .control-bar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    /* sombra sutil para indicar que flota sobre el contenido */
    box-shadow: 0 4px 16px rgba(0,0,0,.55);
  }

  /* Frecuencia */
  .ctrl-block {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 180px;
  }
  .ctrl-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .1em;
    color: var(--muted);
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .freq-display {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
    width: 80px;
    flex-shrink: 0;
    text-align: right;
  }
  .slider-wrap { flex: 1; min-width: 100px; }
  input[type=range] {
    width: 100%;
    -webkit-appearance: none;
    height: 2px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    cursor: pointer;
  }
  .freq-ticks {
    width: 100%;
    display: flex;
    justify-content: space-between;
    margin-top: 4px;
  }
  .freq-tick {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--muted);
    cursor: pointer;
    padding: 2px 0;
  }
  .freq-tick.active { color: var(--accent); }

  /* Divisor vertical entre freq y componente */
  .ctrl-divider {
    width: 1px;
    height: 32px;
    background: var(--border);
    flex-shrink: 0;
  }

  /* Selector de componente */
  .comp-block {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .comp-tabs {
    display: flex;
    gap: 4px;
  }
  .comp-tab {
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 20px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .06em;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
  }
  .comp-tab:hover { background: #131c24; color: var(--text); border-color: var(--border); }
  .comp-tab.active {
    background: #0b1e2d;
    color: var(--accent);
    border-color: #00d4ff55;
  }
  /* Si solo hay una componente disponible, ocultamos el bloque */
  .comp-block.single { display: none; }

  /* ── RECON GRID ──────────────────────────────────────── */
  .recon-section { display: flex; flex-direction: column; gap: 10px; }
  .recon-header { display: flex; align-items: baseline; gap: 8px; }
  .recon-title {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .recon-meta { font-size: 11px; color: var(--muted); }

  .algo-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  @media (min-width: 900px) {
    .algo-grid { grid-template-columns: repeat(4, 1fr); }
  }

  .algo-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: border-color .2s;
  }
  .algo-card:hover { border-color: #00d4ff33; }
  .algo-card:active { border-color: var(--accent); }

  .algo-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
  }
  .algo-name {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
  }
  .algo-patron {
    font-size: 9px;
    color: var(--text-dim);
    background: #131c24;
    padding: 2px 5px;
    border-radius: 3px;
    font-family: var(--mono);
  }
  .algo-img-wrap {
    aspect-ratio: 1;
    background: #0d0d0d;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .algo-img-wrap img {
    width: 100%; height: 100%;
    object-fit: contain; display: block;
  }
  .algo-img-wrap .no-img {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--muted);
    text-align: center;
    padding: 12px;
  }

  /* ── PHANTOM STRIP ───────────────────────────────────── */
  .phantom-strip {
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  @media (min-width: 701px) {
    .phantom-strip .phantom-foto-main { display: none; }
  }
  .phantom-foto-main {
    width: 100px;
    flex-shrink: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .phantom-foto-main-label {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 5px 7px;
    border-bottom: 1px solid var(--border);
  }
  .phantom-foto-main img { width: 100%; height: auto; display: block; }
  .phantom-info { flex: 1; }

  /* ── DEVICE TABS ─────────────────────────────────────── */
  .device-tabs { display: flex; gap: 5px; flex-wrap: wrap; }
  .device-tab {
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 20px;
    font-family: var(--mono);
    font-size: 10px;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: all .15s;
  }
  .device-tab:active, .device-tab.active {
    background: #0b1e2d;
    color: var(--accent);
    border-color: #00d4ff55;
  }

  /* ── EMPTY STATE ─────────────────────────────────────── */
  .empty-state {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px; height: 200px;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px; text-align: center;
  }
  .empty-state .icon { font-size: 30px; opacity: .3; }

  /* ── LIGHTBOX ────────────────────────────────────────── */
  #lightbox {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.9);
    backdrop-filter: blur(6px);
    z-index: 1000;
    align-items: center; justify-content: center;
    flex-direction: column; gap: 10px; padding: 20px;
  }
  #lightbox.open { display: flex; }
  #lightbox img {
    max-width: 100%; max-height: 80vh;
    border-radius: var(--radius);
    border: 1px solid var(--border);
  }
  #lightbox .lb-info {
    font-family: var(--mono); font-size: 10px;
    color: var(--text-dim); text-align: center;
  }
  #lightbox .lb-close {
    position: fixed; top: 16px; right: 16px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim); font-size: 18px;
    cursor: pointer; width: 36px; height: 36px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }

  /* ── MOBILE ──────────────────────────────────────────── */
  @media (max-width: 700px) {
    .app {
      grid-template-rows: 50px auto 1fr;
      grid-template-columns: 1fr;
      height: 100vh; overflow: hidden;
    }
    header { grid-column: 1; padding: 0 12px; }
    .burger { display: flex; align-items: center; justify-content: center; }

    aside {
      grid-row: 2; grid-column: 1;
      border-right: none;
      border-bottom: 1px solid var(--border);
      max-height: 0; overflow: hidden;
      padding-top: 0; padding-bottom: 0;
      transition: max-height .3s ease, padding .3s ease;
    }
    aside.open {
      max-height: 350px;
      padding: 10px 12px;
      overflow-y: auto;
    }
    .filters-row { display: flex; gap: 12px; flex-wrap: wrap; }
    .filter-group { flex: 1; min-width: 80px; }
    .filter-btn { padding: 5px 7px; font-size: 12px; }

    main { grid-row: 3; grid-column: 1; padding: 10px; gap: 10px; }
    .algo-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }

    /* En móvil la barra sticky ocupa todo el ancho sin radio lateral */
    .control-bar {
      border-radius: 0 0 var(--radius) var(--radius);
      margin: -10px -10px 0;   /* cancela el padding de main para que llegue a los bordes */
      width: calc(100% + 20px);
      padding: 8px 12px;
    }

    /* En móvil el divisor vertical no tiene sentido */
    .ctrl-divider { display: none; }
    .control-bar { flex-direction: column; align-items: flex-start; gap: 10px; }
    .ctrl-block { width: 100%; }
    .comp-block { width: 100%; }
  }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="logo-dot"></div>
    <div>
      <h1>EIT Reconstruction Viewer</h1>
      <div class="subtitle">Electrical Impedance Tomography · TFG Defense</div>
    </div>
    <div class="badge" id="status-badge">Loading…</div>
    <button class="burger" id="burger-btn" onclick="toggleSidebar()">☰</button>
  </header>

  <aside id="sidebar">
    <div class="filters-row">
      <div class="filter-group">
        <div class="filter-label">Phantom</div>
        <div id="filter-phantom"></div>
      </div>
      <div class="filter-group">
        <div class="filter-label">Experiment</div>
        <div id="filter-exp"></div>
      </div>
      <div class="filter-group">
        <div class="filter-label">Position</div>
        <div id="filter-pos"></div>
      </div>
    </div>
    <div class="sidebar-foto" id="sidebar-foto" style="display:none">
      <div class="sidebar-foto-label">Phantom photo</div>
      <img id="sidebar-foto-img" src="" alt="phantom"/>
    </div>
  </aside>

  <main>
    <!-- Barra unificada: frecuencia + componente -->
    <div class="control-bar" id="control-bar" style="display:none">

      <!-- Bloque frecuencia -->
      <div class="ctrl-block">
        <span class="ctrl-label">Freq</span>
        <div class="slider-wrap">
          <input type="range" id="freq-slider" min="0" max="0" value="0"/>
          <div class="freq-ticks" id="freq-ticks"></div>
        </div>
        <div class="freq-display" id="freq-display">—</div>
      </div>

      <!-- Divisor -->
      <div class="ctrl-divider"></div>

      <!-- Bloque componente -->
      <div class="comp-block" id="comp-block">
        <span class="ctrl-label">Signal</span>
        <div class="comp-tabs" id="comp-tabs"></div>
      </div>

    </div>

    <div id="content">
      <div class="empty-state">
        <div class="icon">⬡</div>
        <div>Select a phantom and experiment</div>
      </div>
    </div>
  </main>
</div>

<div id="lightbox">
  <button class="lb-close" onclick="closeLightbox()">✕</button>
  <img id="lb-img" src="" alt=""/>
  <div class="lb-info" id="lb-info"></div>
</div>

<script>
let MANIFEST = null;

// Etiquetas cortas para los tabs de componente
const COMP_SHORT = { abs: "|Z|", real: "Re(σ)", imag: "Im(ε)" };

let state = {
  phantom:  null,
  exp:      null,
  pos:      null,
  device:   null,
  freqIdx:  0,
  comp:     null,   // componente activa: "abs" | "real" | "imag"
};

// Componentes disponibles según el manifest (se rellena al cargar)
let availableComps = [];

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}
function closeSidebarOnPos() {
  if (window.innerWidth <= 700)
    document.getElementById('sidebar').classList.remove('open');
}

// ── CARGA DEL MANIFEST ────────────────────────────────────
async function loadManifest() {
  try {
    const r = await fetch("manifest.json");
    if (!r.ok) throw new Error("not found");
    MANIFEST = await r.json();

    // Leer componentes disponibles desde __meta__ (nuevo script)
    // o inferirlas de los resultados si es manifest antiguo
    if (MANIFEST.__meta__ && MANIFEST.__meta__.componentes) {
      availableComps = MANIFEST.__meta__.componentes;
    } else {
      const found = new Set();
      walkResults(MANIFEST, r => r.componente && found.add(r.componente));
      availableComps = found.size ? [...found] : ["abs"];
    }

    // Componente por defecto: abs si existe, si no la primera disponible
    state.comp = availableComps.includes("real") ? "real" : availableComps[0];

    buildCompTabs();

    const nExp  = countExps();
    const nImgs = countImages();
    document.getElementById("status-badge").textContent =
      `${nExp} exp · ${nImgs} imgs · ${availableComps.join("/").toUpperCase()}`;

    buildPhantomFilter();
  } catch(e) {
    document.getElementById("status-badge").textContent = "⚠ manifest.json not found";
    document.getElementById("content").innerHTML =
      `<div class="empty-state"><div class="icon">⚠</div><div>Run generar_imagenes_eit.py first</div></div>`;
  }
}

function walkResults(obj, fn) {
  if (!obj || typeof obj !== "object") return;
  if (Array.isArray(obj.resultados)) obj.resultados.forEach(fn);
  for (const k in obj)
    if (k !== "resultados" && typeof obj[k] === "object") walkResults(obj[k], fn);
}

function countExps() {
  let n = 0;
  for (const ph in MANIFEST) {
    if (ph === "__meta__") continue;
    n += Object.keys(MANIFEST[ph]).length;
  }
  return n;
}
function countImages() {
  let n = 0;
  walkResults(MANIFEST, () => n++);
  return n;
}

// ── TABS DE COMPONENTE ────────────────────────────────────
function buildCompTabs() {
  const container = document.getElementById("comp-tabs");
  const block     = document.getElementById("comp-block");
  container.innerHTML = "";

  if (availableComps.length <= 1) {
    block.classList.add("single");   // ocultar si solo hay una
    return;
  }
  block.classList.remove("single");

  for (const comp of availableComps) {
    const btn = document.createElement("button");
    btn.className = "comp-tab" + (comp === state.comp ? " active" : "");
    btn.textContent = COMP_SHORT[comp] || comp.toUpperCase();
    btn.title = labelForComp(comp);
    btn.dataset.comp = comp;
    btn.addEventListener("click", () => selectComp(comp));
    container.appendChild(btn);
  }
}

function labelForComp(comp) {
  if (MANIFEST.__meta__ && MANIFEST.__meta__.comp_labels)
    return MANIFEST.__meta__.comp_labels[comp] || comp;
  return { abs: "Módulo |Z|", real: "Parte real (σ)", imag: "Parte imaginaria (ε)" }[comp] || comp;
}

function selectComp(comp) {
  state.comp = comp;
  // Actualizar tab activo sin re-renderizar todo
  document.querySelectorAll(".comp-tab").forEach(b =>
    b.classList.toggle("active", b.dataset.comp === comp)
  );
  renderContent();
}

// ── FILTROS SIDEBAR ───────────────────────────────────────
function buildPhantomFilter() {
  const c = document.getElementById("filter-phantom");
  c.innerHTML = "";
  for (const ph of Object.keys(MANIFEST).filter(k => k !== "__meta__")) {
    const btn = makeBtn(ph, ph, () => selectPhantom(ph));
    if (ph === state.phantom) btn.classList.add("active");
    c.appendChild(btn);
  }
}

function buildExpFilter(phantom) {
  const c = document.getElementById("filter-exp");
  c.innerHTML = "";
  for (const ex of Object.keys(MANIFEST[phantom] || {})) {
    const btn = makeBtn(ex.replace(/_/g," "), ex, () => selectExp(ex));
    if (ex === state.exp) btn.classList.add("active");
    c.appendChild(btn);
  }
}

function buildPosFilter(phantom, exp) {
  const c = document.getElementById("filter-pos");
  c.innerHTML = "";
  for (const pos of Object.keys((MANIFEST[phantom]||{})[exp]||{})) {
    const btn = makeBtn(pos, pos, () => { selectPos(pos); closeSidebarOnPos(); });
    if (pos === state.pos) btn.classList.add("active");
    c.appendChild(btn);
  }
}

function makeBtn(label, value, onClick) {
  const btn = document.createElement("button");
  btn.className = "filter-btn";
  btn.textContent = label;
  btn.dataset.value = value;
  btn.addEventListener("click", onClick);
  return btn;
}

function setActive(id, value) {
  document.querySelectorAll(`#${id} .filter-btn`).forEach(b =>
    b.classList.toggle("active", b.dataset.value === value)
  );
}

function updateSidebarFoto(foto) {
  const wrapper = document.getElementById("sidebar-foto");
  const img     = document.getElementById("sidebar-foto-img");
  if (foto && window.innerWidth > 700) {
    img.src = foto;
    wrapper.style.display = "block";
  } else {
    wrapper.style.display = "none";
  }
}

// ── SELECCIÓN ─────────────────────────────────────────────
function selectPhantom(ph) {
  state = { ...state, phantom: ph, exp: null, pos: null, device: null, freqIdx: 0 };
  setActive("filter-phantom", ph);
  buildExpFilter(ph);
  document.getElementById("filter-pos").innerHTML = "";
  updateSidebarFoto(null);
  renderContent();
}

function selectExp(ex) {
  state.exp = ex; state.pos = null; state.device = null; state.freqIdx = 0;
  setActive("filter-exp", ex);
  buildPosFilter(state.phantom, ex);
  updateSidebarFoto(null);
  const positions = Object.keys((MANIFEST[state.phantom]||{})[ex]||{});
  if (positions.length === 1) { selectPos(positions[0]); closeSidebarOnPos(); }
  else renderContent();
}

function selectPos(pos) {
  state.pos = pos; state.device = null; state.freqIdx = 0;
  setActive("filter-pos", pos);
  renderContent();
}

function selectDevice(dev) {
  state.device = dev; state.freqIdx = 0;
  renderContent();
}

// ── RENDER PRINCIPAL ──────────────────────────────────────
function renderContent() {
  const content = document.getElementById("content");
  if (!state.phantom || !state.exp || !state.pos) {
    content.innerHTML = `<div class="empty-state"><div class="icon">⬡</div><div>Select phantom, experiment and position</div></div>`;
    document.getElementById("control-bar").style.display = "none";
    updateSidebarFoto(null);
    return;
  }

  const posData = ((MANIFEST[state.phantom]||{})[state.exp]||{})[state.pos]||{};
  const devices = Object.keys(posData).filter(k => k !== "foto" && k !== "resultados");

  if (!devices.length) {
    content.innerHTML = `<div class="empty-state"><div class="icon">⬡</div><div>No data available</div></div>`;
    return;
  }

  if (!state.device || !devices.includes(state.device)) state.device = devices[0];

  const devData = posData[state.device] || {};
  const allResults = devData.resultados || [];
  const foto = posData.foto || devData.foto || null;

  updateSidebarFoto(foto);

  // Filtrar por componente activa
  // Soporte retrocompatible: si los resultados no tienen campo "componente"
  // (manifest antiguo) los mostramos todos sin filtrar
  const hasCompField = allResults.some(r => r.componente);
  const results = hasCompField
    ? allResults.filter(r => r.componente === state.comp)
    : allResults;

  const freqs = [...new Set(results.map(r => r.freq_hz))].sort((a,b) => a-b);
  if (!freqs.length) {
    content.innerHTML = `<div class="empty-state"><div class="icon">⬡</div><div>No reconstructions for ${(COMP_SHORT[state.comp]||state.comp)}</div></div>`;
    document.getElementById("control-bar").style.display = "none";
    return;
  }

  if (state.freqIdx >= freqs.length) state.freqIdx = 0;
  const selFreq = freqs[state.freqIdx];
  buildControlBar(freqs);

  const atFreq = results.filter(r => r.freq_hz === selFreq);
  const byPatron = {};
  for (const r of atFreq) {
    if (!byPatron[r.patron]) byPatron[r.patron] = {};
    byPatron[r.patron][r.metodo] = r;
  }

  const COLORS = { SVD: "#00d4ff", JAC: "#ff6b35", GREIT: "#a78bfa", BP: "#34d399" };
  const compLabel = labelForComp(state.comp);

  let html = `<div class="phantom-strip">
    ${foto ? `<div class="phantom-foto-main">
      <div class="phantom-foto-main-label">Phantom</div>
      <img src="${foto}" loading="lazy"/>
    </div>` : ""}
    <div class="phantom-info">
      <div style="margin-bottom:8px">
        <div style="font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px">Device</div>
        <div class="device-tabs">
          ${devices.map(d =>
            `<button class="device-tab ${d===state.device?"active":""}" onclick="selectDevice('${d}')">${d}</button>`
          ).join("")}
        </div>
      </div>
      <div style="font-size:11px;color:var(--text-dim);line-height:1.8">
        <span style="color:var(--text)">${state.phantom}</span> ·
        <span style="color:var(--text)">${state.exp.replace(/_/g," ")}</span> ·
        <span style="color:var(--text)">${state.pos}</span> ·
        <span style="color:var(--accent)">${state.device}</span> ·
        <span style="color:var(--accent2)">${compLabel}</span>
      </div>
    </div>
  </div>`;

  for (const [patron, algos] of Object.entries(byPatron)) {
    const list = Object.entries(algos);
    html += `<div class="recon-section">
      <div class="recon-header">
        <span class="recon-title">Pattern: ${patron}</span>
        <span class="recon-meta">${list.length} algo${list.length>1?"s":""}</span>
      </div>
      <div class="algo-grid">
        ${list.map(([name, r]) => `
          <div class="algo-card" onclick="openLightbox('${r.img}','${name} · ${patron} · ${r.freq_label} · ${state.device} · ${COMP_SHORT[state.comp]||state.comp}')">
            <div class="algo-card-header">
              <span class="algo-name" style="color:${COLORS[name]||'var(--accent)'}">${name}</span>
              <span class="algo-patron">${patron}</span>
            </div>
            <div class="algo-img-wrap">
              <img src="${r.img}" loading="lazy"
                onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
              <div class="no-img" style="display:none;width:100%;height:100%;flex-direction:column;align-items:center;justify-content:center">
                <div style="font-size:18px;opacity:.3">⬡</div><div>${name}</div>
              </div>
            </div>
          </div>`).join("")}
      </div>
    </div>`;
  }

  content.innerHTML = html;
}

// ── BARRA DE CONTROLES (freq + comp ya gestionada arriba) ─
function buildControlBar(freqs) {
  const bar    = document.getElementById("control-bar");
  const slider = document.getElementById("freq-slider");
  const disp   = document.getElementById("freq-display");
  const ticks  = document.getElementById("freq-ticks");

  bar.style.display = "flex";
  slider.max   = freqs.length - 1;
  slider.value = state.freqIdx;
  disp.textContent = fmtFreq(freqs[state.freqIdx]);

  ticks.innerHTML = freqs.map((f,i) => `
    <span class="freq-tick ${i===state.freqIdx?"active":""}" onclick="setFreqIdx(${i})">${fmtFreqShort(f)}</span>
  `).join("");

  slider.oninput = e => { state.freqIdx = parseInt(e.target.value); renderContent(); };
}

function setFreqIdx(i) { state.freqIdx = i; renderContent(); }

function fmtFreq(hz) {
  if (hz >= 1e6) return `${(hz/1e6).toFixed(2)} MHz`;
  if (hz >= 1e3) return `${(hz/1e3).toFixed(1)} kHz`;
  return `${hz.toFixed(0)} Hz`;
}
function fmtFreqShort(hz) {
  if (hz >= 1e6) return `${(hz/1e6).toFixed(1)}M`;
  if (hz >= 1e3) return `${(hz/1e3).toFixed(0)}k`;
  return `${hz.toFixed(0)}`;
}

// ── LIGHTBOX ──────────────────────────────────────────────
function openLightbox(src, info) {
  document.getElementById("lb-img").src = src;
  document.getElementById("lb-info").textContent = info;
  document.getElementById("lightbox").classList.add("open");
}
function closeLightbox() {
  document.getElementById("lightbox").classList.remove("open");
}
document.getElementById("lightbox").addEventListener("click", e => {
  if (e.target === e.currentTarget) closeLightbox();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeLightbox(); });

window.addEventListener("resize", () => {
  if (state.pos) {
    const posData = ((MANIFEST[state.phantom]||{})[state.exp]||{})[state.pos]||{};
    const devData = posData[state.device] || {};
    updateSidebarFoto(posData.foto || devData.foto || null);
  }
});

loadManifest();
</script>
</body>
</html>
